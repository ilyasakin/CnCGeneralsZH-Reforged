;//////////////////////////////////////////////////////////////////////////////
;FILE: GamepadReforged.ini (SYSTEM) ///////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;
; A gamepad's buttons (G1, docs/mac-port/tasks/G1-gamepad.md).  MASTER COPY: the
; build copies it to Run/Data/INI/, where the game reads it.
;
; A gamepad only does what a mouse button or a key already does.  So a binding
; names a mouse button (MouseLeft, MouseMiddle, MouseRight), modifiers held alone
; (Modifier, with Modifiers = SHIFT), a key (Key = KEY_x, with Modifiers), or a
; Command: the key the player's own input scheme binds that
; command to at the moment of the press (STOP is S under Modern, G under W A S D).
; Nothing here names anything the game logic would read differently.
;
; Buttons are named by where they sit, not by what is printed on them: South is
; A on an Xbox pad and the Deck, Cross on a PlayStation pad, B on a Nintendo one.
; With = <button> makes a chord: that binding replaces the button's own while the
; other is held, and the held button's own key is let go meanwhile.
;
; Fixed in the code, not bound here: the left stick moves the pointer, the right
; stick scrolls the camera (the arrow keys), and the triggers zoom (the wheel).
; While a message box is up, South clicks its OK or Yes and East its Cancel or No.

; ---- the mouse ---------------------------------------------------------------

GamepadBinding South            ; select, confirm, place; held, a drag box
  Action = MouseLeft
End

GamepadBinding East             ; command (Modern) or cancel
  Action = MouseRight
End

GamepadBinding RightStick       ; a middle click resets the camera
  Action = MouseMiddle
End

; ---- the modifiers, held while the shoulder is --------------------------------

GamepadBinding LeftShoulder     ; waypoints, add to the selection
  Action = Modifier
  Modifiers = SHIFT
End

GamepadBinding RightShoulder    ; force fire; with the D-pad, make a group
  Action = Modifier
  Modifiers = CTRL
End

; ---- the command bar ---------------------------------------------------------
; North puts the pointer on the command bar's first button; the D-pad then moves
; it button to button, South presses the one under it, and East or North again
; leaves.  It is the build menu: a dozer's structures are on the bar.

GamepadBinding North
  Action = CommandBar
End

; ---- orders ------------------------------------------------------------------

GamepadBinding West
  Action = Command
  Command = STOP
End

GamepadBinding LeftStick
  Action = Command
  Command = TOGGLE_ATTACKMOVE
End

GamepadBinding Back
  Action = Command
  Command = SELECT_MATCHING_UNITS
End

GamepadBinding Start
  Action = Command
  Command = OPTIONS
End

; ---- control groups: 1-4 on the D-pad, 5-8 with the left shoulder -------------
; With the right shoulder (Ctrl) held, the same buttons make the group.

GamepadBinding DPadUp
  Action = Command
  Command = SELECT_TEAM1
End

GamepadBinding DPadRight
  Action = Command
  Command = SELECT_TEAM2
End

GamepadBinding DPadDown
  Action = Command
  Command = SELECT_TEAM3
End

GamepadBinding DPadLeft
  Action = Command
  Command = SELECT_TEAM4
End

GamepadBinding DPadUp
  With = LeftShoulder
  Action = Command
  Command = SELECT_TEAM5
End

GamepadBinding DPadRight
  With = LeftShoulder
  Action = Command
  Command = SELECT_TEAM6
End

GamepadBinding DPadDown
  With = LeftShoulder
  Action = Command
  Command = SELECT_TEAM7
End

GamepadBinding DPadLeft
  With = LeftShoulder
  Action = Command
  Command = SELECT_TEAM8
End

; ---- the back buttons (the Deck's L4, R4, L5, R5; Xbox Elite paddles) --------

GamepadBinding LeftPaddle1
  Action = Command
  Command = SELECT_NEXT_IDLE_WORKER
End

GamepadBinding RightPaddle1
  Action = Command
  Command = SELECT_ALL_MILITARY
End

GamepadBinding LeftPaddle2
  Action = Command
  Command = SELECT_ALL
End

GamepadBinding RightPaddle2
  Action = Command
  Command = SCATTER
End
