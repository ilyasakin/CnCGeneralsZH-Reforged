;//////////////////////////////////////////////////////////////////////////////
;FILE: GamepadReforged.ini (SYSTEM) ///////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;
; A gamepad's buttons (G1).  MASTER COPY: the
; build copies it to Run/Data/INI/, where the game reads it.
;
; A gamepad only does what a mouse button or a key already does.  So a binding
; names a mouse button (MouseLeft, MouseMiddle, MouseRight), modifiers held alone
; (Modifier, with Modifiers = SHIFT), a key (Key = KEY_x, with Modifiers), or a
; Command: the key the command map binds that command to at the moment of the press,
; or, where no key of its own reaches it (the command grid's places took S from stop),
; the command's own message, the one that key would send.
; Nothing here names anything the game logic would read differently.
;
; Buttons are named by where they sit, not by what is printed on them: South is
; A on an Xbox pad and the Steam Deck, Cross on a PlayStation pad, B on a Nintendo one.
; South and East are the exception: South names confirm and East cancel.  A
; Nintendo pad confirms with A, its right button, so there South's binding is
; on A and East's on B, below it; Options > Controls > Swap Confirm and Cancel
; trades the two on any pad.
; With = <button> makes a chord: that binding replaces the button's own while the
; other is held, and the held button's own key is let go meanwhile.
;
; Fixed in the code, not bound here: the left stick moves the pointer and the
; right stick scrolls the camera (the arrow keys).  While a message box is up,
; South clicks its OK or Yes and East its Cancel or No.
;
; Why each button does what it does: G1-gamepad-screens.md, "The buttons in a
; match", from the console strategy games' own layouts (C&C 3 and Red Alert 3
; on the Xbox 360, Halo Wars, the Age of Empires console editions).

; ---- the face buttons: select, order, take back -------------------------------

GamepadBinding South            ; select; twice, all of that type on screen; held, a drag box
  Action = MouseLeft
End

GamepadBinding West             ; the order: move, attack, enter, repair - what is under the pointer
  Action = Order
End

GamepadBinding East             ; take back: what is armed, else the selection
  Action = Cancel
End

GamepadBinding North            ; attack move, aimed with South or West
  Action = Command
  Command = TOGGLE_ATTACKMOVE
End

; ---- the triggers: the command menu and the queue ------------------------------

GamepadBinding RightTrigger     ; held, the command radial; a tap, the command bar
  Action = CommandBar
End

GamepadBinding LeftTrigger      ; held: South adds to the selection, West queues
  Action = Modifier
  Modifiers = SHIFT
End

; ---- the shoulders ------------------------------------------------------------

GamepadBinding LeftShoulder     ; a tap, the next idle worker; held, the right stick zooms and turns
  Action = Command
  Command = SELECT_NEXT_IDLE_WORKER
  OnRelease = Yes
  CameraLayer = Yes
End

GamepadBinding RightShoulder    ; held: South is force fire, the D-pad makes a group
  Action = Modifier
  Modifiers = CTRL
End

GamepadBinding RightShoulder    ; both shoulders: stop
  With = LeftShoulder
  Action = Command
  Command = STOP
End

GamepadBinding LeftShoulder
  With = RightShoulder
  Action = Command
  Command = STOP
End

GamepadBinding North            ; the left shoulder and Y: the whole army
  With = LeftShoulder
  Action = Command
  Command = SELECT_ALL
End

GamepadBinding East             ; the right shoulder and B: scatter
  With = RightShoulder
  Action = Command
  Command = SCATTER
End

; ---- View, Start and the stick clicks -------------------------------------------

GamepadBinding Back             ; on its release, so that held it is the base chord below
  Action = Command
  Command = VIEW_LAST_RADAR_EVENT
  OnRelease = Yes
End

GamepadBinding RightShoulder    ; with View held: the next production building, selected and looked at
  With = Back
  Action = Structures
  Step = Next
End

GamepadBinding LeftShoulder     ; with View held: the previous one
  With = Back
  Action = Structures
  Step = Previous
End

GamepadBinding Start
  Action = Command
  Command = OPTIONS
End

GamepadBinding LeftStick        ; the command centre
  Action = Command
  Command = VIEW_COMMAND_CENTER
End

GamepadBinding RightStick       ; a middle click resets the camera
  Action = MouseMiddle
End

; ---- control groups: 1-4 on the D-pad, 5-8 with the left trigger ---------------
; With the right shoulder (Ctrl) held, the same buttons make the group.  A group
; recalled twice puts the camera on it.

GamepadBinding DPadUp
  Action = Command
  Command = SELECT_TEAM1
End

GamepadBinding DPadRight
  Action = Command
  Command = SELECT_TEAM2
End

GamepadBinding DPadDown
  Action = Command
  Command = SELECT_TEAM3
End

GamepadBinding DPadLeft
  Action = Command
  Command = SELECT_TEAM4
End

GamepadBinding DPadUp
  With = LeftTrigger
  Action = Command
  Command = SELECT_TEAM5
End

GamepadBinding DPadRight
  With = LeftTrigger
  Action = Command
  Command = SELECT_TEAM6
End

GamepadBinding DPadDown
  With = LeftTrigger
  Action = Command
  Command = SELECT_TEAM7
End

GamepadBinding DPadLeft
  With = LeftTrigger
  Action = Command
  Command = SELECT_TEAM8
End

; ---- the back buttons (the Deck's L4, R4, L5, R5; Xbox Elite paddles) --------

GamepadBinding LeftPaddle1
  Action = Command
  Command = SELECT_NEXT_IDLE_WORKER
End

GamepadBinding RightPaddle1
  Action = Command
  Command = SELECT_ALL
End

GamepadBinding LeftPaddle2
  Action = Command
  Command = SELECT_MATCHING_UNITS
End

GamepadBinding RightPaddle2
  Action = Command
  Command = SCATTER
End
